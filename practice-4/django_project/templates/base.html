<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Практика Django{% endblock %}</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #17212b; background: #f3f6fb; }
    body { margin: 0; } header { background: #243b63; color: white; padding: 18px max(20px, calc((100vw - 960px)/2)); }
    nav { display: flex; gap: 18px; flex-wrap: wrap; } nav a { color: white; text-decoration: none; font-weight: 600; }
    main { max-width: 960px; margin: 30px auto; padding: 0 20px 50px; }
    h1 { margin-top: 0; } .card { background: white; border-radius: 12px; padding: 20px; margin: 16px 0; box-shadow: 0 2px 12px #142b4b12; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
    label { display: block; margin: 12px 0 6px; font-weight: 600; }
    input, select { font: inherit; padding: 10px; border: 1px solid #aeb9ca; border-radius: 7px; max-width: 100%; }
    button, .button { font: inherit; background: #2357aa; color: white; border: 0; border-radius: 7px; padding: 10px 14px; cursor: pointer; text-decoration: none; display: inline-block; }
    button:hover, .button:hover { background: #173c79; } .danger { background: #b33b40; }
    .error { color: #8e1720; background: #ffe8e8; padding: 12px; border-radius: 7px; }
    .success { color: #15582e; background: #e4f7e9; padding: 12px; border-radius: 7px; }
    img { max-width: 100%; height: 180px; object-fit: contain; }
    ol.breeds { columns: 3 180px; } li { margin: 5px 0; }
  </style>
</head>
<body>
  <header><nav><a href="{% url 'home' %}">Главная</a><a href="{% url 'dogs' %}">Породы собак</a><a href="{% url 'team' %}">Команда Pokémon</a><a href="{% url 'battle' %}">Тренировочный бой</a></nav></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
